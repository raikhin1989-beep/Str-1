name: Deploy to server

# Деплой сайта дегустации на тот же сервер, где уже живёт проект Str
# (https://raikhin.duckdns.org/).
#
# Что куда едет:
#   site/  → /var/www/str-1   статика: healthz, version, /static, запасная страница
#   app/   → /opt/str-1/app   приложение FastAPI, служба str-1-app на 127.0.0.1:8082
# Caddy отдаёт статику файлами, остальное проксирует в приложение. /healthz и
# /version остаются файлами намеренно: по ним проверяется, что доехал деплой,
# и падение приложения не должно выглядеть как провалившийся выкат.
#
# ВАЖНО, ПОЧЕМУ ЗДЕСЬ ОТДЕЛЬНЫЙ CADDY НА ПОРТУ 8081, А НЕ ОСНОВНОЙ НА 80/443:
# деплой репозитория Str перезаписывает /etc/caddy/Caddyfile целиком и
# синхронизирует /var/www/html с --delete. Если бы этот workflow писал в те же
# места, два проекта затирали бы друг друга — Str-1 пропадал бы при каждом
# деплое Str. Поэтому здесь всё своё и ничего общего:
#   каталог сайта      /var/www/str-1        (Str пользуется /var/www/html)
#   конфиг веб-сервера /etc/caddy/str-1.caddyfile  (Str — /etc/caddy/Caddyfile)
#   службы             str-1-site.service, str-1-app.service   (Str — caddy.service)
#   порты              8081 и 8082           (Str — 80 и 443)
#   данные             /var/lib/str-1        (вне докрута: его чистит --delete)
# Основной Caddy, сайт Str и его бэкенд этим workflow не затрагиваются.
#
# Порт 8081 — запасной вход: он не зависит ни от DNS, ни от чужого конфига и
# остаётся рабочим, даже когда домен или основной Caddy сломаны. Домен по HTTPS
# обслуживает основной Caddy через свой import каталога sites.d.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SERVER_HOST       — IP/домен сервера     [обязательно]
#   SERVER_PASSWORD   — пароль SSH           [обязательно]
#   SERVER_USER       — пользователь SSH     [опционально, по умолчанию root]
#   SERVER_PORT       — порт SSH             [опционально, по умолчанию 22]
#   DUCKDNS_SUBDOMAIN — метка поддомена      [для домена и HTTPS]
#   DUCKDNS_TOKEN     — токен аккаунта DuckDNS [для домена и HTTPS]
#   ADMIN_PASSWORD    — пароль админки       [без него /admin отвечает 503]
#   ANTHROPIC_API_KEY — ключ Anthropic API   [не работает с сервера в РФ]
#   YANDEX_API_KEY    — ключ Yandex AI Studio [основной провайдер распознавания]
#   YANDEX_FOLDER_ID  — каталог Yandex Cloud  [нужен вместе с ключом]
#   TELEGRAM_BOT_TOKEN      — токен у @BotFather   [для привязки и рассылки]
#   TELEGRAM_WEBHOOK_SECRET — случайная строка     [A-Za-z0-9_- , до 256 символов]
#
# Секреты попадают в приложение через /etc/str-1/app.env (права 600, владелец
# str1) и в логи не пишутся: проверяется только факт наличия.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'app/**'
      - 'tests/**'
      - 'requirements.txt'
      - 'requirements-dev.txt'
      - 'pytest.ini'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать на сервере"
        type: choice
        options: [deploy, inspect, broadcast, telegram]
        default: deploy

concurrency:
  group: deploy-server-str-1
  cancel-in-progress: false

env:
  SITE_ROOT: /var/www/str-1
  APP_ROOT: /opt/str-1
  APP_PORT: "8082"
  SITE_PORT: "8081"
  # Как сайт отдаётся наружу:
  #   duckdns — <DUCKDNS_SUBDOMAIN>.duckdns.org по HTTPS через основной Caddy,
  #             сертификат Let's Encrypt. Требует секретов DUCKDNS_SUBDOMAIN и
  #             DUCKDNS_TOKEN; без них шаг честно предупреждает и остаётся HTTP.
  #   off     — только http://<SERVER_HOST>:8081, без домена и TLS.
  # Отдача на 8081 работает в обоих режимах: это запасной вход, не зависящий
  # ни от DNS, ни от чужого конфига.
  TLS_MODE: duckdns

jobs:
  # ── TESTS: ворота перед выкатом ────────────────────────────────────────────
  # Красные тесты означают, что деплоя не будет: job deploy зависит от этого.
  tests:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -q -r requirements-dev.txt
      - run: pytest -q

  # ── DEPLOY: выложить сайт и приложение на сервер ────────────────────────────
  deploy:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    needs: tests
    runs-on: ubuntu-latest
    env:
      SERVER_ADDR: ${{ secrets.SERVER_HOST }}
      SERVER_LOGIN: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || 22 }}
      # Контекст secrets недоступен в step-level if, поэтому раскрываем здесь.
      HAS_DUCKDNS: ${{ secrets.DUCKDNS_SUBDOMAIN != '' && secrets.DUCKDNS_TOKEN != '' }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      AI_PROVIDER: ${{ secrets.AI_PROVIDER }}
      AI_PHOTO: ${{ secrets.AI_PHOTO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
    steps:
      # Проверка до первого подключения: иначе про незаданный секрет узнаёшь из
      # невнятной ошибки ssh-action, а не из явного сообщения.
      # Имя бота спрашиваем здесь, на раннере: у него есть доступ к
      # api.telegram.org, а у сервера в Москве — нет.
      # Условие проверяем внутри скрипта, а не в step-level `if`: контекст
      # secrets там недоступен, и такой workflow GitHub отвергает целиком.
      - name: Resolve bot username
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "токен бота не задан — пропускаем"
            exit 0
          fi
          me=$(curl -sS --max-time 20 "https://api.telegram.org/bot$TOKEN/getMe" \
               | sed -n 's/.*"username":"\([^"]*\)".*/\1/p')
          if [ -n "$me" ]; then
            echo "TELEGRAM_BOT_USERNAME=$me" >> "$GITHUB_ENV"
            echo "бот: @$me"
          else
            echo "::warning::телеграм не ответил на getMe — кнопка привязки не появится"
          fi

      - name: Check secrets
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          missing=""
          [ -n "$SERVER_ADDR" ] || missing="$missing SERVER_HOST"
          [ -n "$PASS" ]        || missing="$missing SERVER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты репозитория:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "секреты на месте; вход: $SERVER_LOGIN@***:$SERVER_SSH_PORT"

      # SITE_DOMAIN вычисляется в шелле, а не в env job'а: он собирается из
      # секрета, а к секретам в env выражениях доступ только на подстановку.
      - name: Resolve site domain
        env:
          SUB: ${{ secrets.DUCKDNS_SUBDOMAIN }}
        run: |
          set -e
          domain=""
          case "$TLS_MODE" in
            duckdns)
              if [ "$HAS_DUCKDNS" = "true" ]; then
                domain="${SUB}.duckdns.org"
              else
                # Не ошибка: поддомен на duckdns.org заводится руками через их
                # веб-интерфейс, API создания у них нет. Пока этого не сделали,
                # сайт продолжает жить на порту 8081.
                echo "::warning::нет секретов DUCKDNS_SUBDOMAIN/DUCKDNS_TOKEN — домен и HTTPS пропущены, остаётся порт $SITE_PORT"
              fi
              ;;
            off) ;;
            *) echo "::error::неизвестный TLS_MODE='$TLS_MODE'"; exit 1 ;;
          esac
          echo "SITE_DOMAIN=$domain" >> "$GITHUB_ENV"
          echo "домен: ${domain:-<нет, только порт $SITE_PORT>}"

      # У DuckDNS нет API для создания поддомена — только обновление IP уже
      # существующего. Если поддомен не заведён, ответ будет KO.
      - name: Refresh DuckDNS IP
        if: ${{ env.SITE_DOMAIN != '' }}
        env:
          SUB: ${{ secrets.DUCKDNS_SUBDOMAIN }}
          TOKEN: ${{ secrets.DUCKDNS_TOKEN }}
        run: |
          set -e
          resp=$(curl -sS --get "https://www.duckdns.org/update" \
                   --data-urlencode "domains=$SUB" \
                   --data-urlencode "token=$TOKEN" \
                   --data-urlencode "ip=$SERVER_ADDR")
          echo "duckdns: $resp"
          # API отвечает голым OK или KO; KO — неверный токен либо поддомен,
          # который так и не завели.
          [ "$resp" = "OK" ] || { echo "::error::DuckDNS вернул '$resp' — проверьте, что поддомен создан на duckdns.org и токен верный"; exit 1; }

      - uses: actions/checkout@v4

      # Caddy на сервере уже стоит из-под проекта Str, но полагаться на это
      # нельзя: сервер могут пересоздать. Шаг идемпотентный.
      - name: Prepare server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          envs: SITE_ROOT,SITE_PORT,APP_ROOT
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo "=== caddy и rsync ==="
            if ! command -v caddy >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gnupg rsync
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
                | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
                > /etc/apt/sources.list.d/caddy-stable.list
              apt-get update -qq
              apt-get install -y -qq caddy
            else
              command -v rsync >/dev/null 2>&1 || apt-get install -y -qq rsync
            fi
            caddy version

            echo "=== каталог сайта ==="
            mkdir -p "$SITE_ROOT"

            echo "=== python для приложения ==="
            if ! command -v python3 >/dev/null 2>&1 || ! python3 -c 'import venv' 2>/dev/null; then
              apt-get update -qq
              apt-get install -y -qq python3 python3-venv
            fi
            python3 --version

            # Отдельный системный пользователь: приложение не должно ходить
            # от root, а база на шаге 2 будет принадлежать именно ему.
            id str1 >/dev/null 2>&1 || useradd --system --home-dir "$APP_ROOT" --shell /usr/sbin/nologin str1
            mkdir -p "$APP_ROOT" /var/lib/str-1 /var/backups/str-1 /etc/str-1
            chmod 750 /etc/str-1
            # Каталог данных вне докрута: /var/www/str-1 синхронизируется
            # с --delete и всё лишнее там стирается следующим выкатом.
            chown str1:str1 /var/lib/str-1

            echo "=== порт $SITE_PORT в ufw, если он включён ==="
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow "${SITE_PORT}/tcp" >/dev/null 2>&1 || true
            fi

      # rsync, а не envs ssh-action: через окружение проходят только маленькие
      # текстовые полезные нагрузки, на бинарных ассетах это молча ломается.
      - name: Upload site and app
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          # sshpass -e читает пароль из окружения, чтобы он не был виден
          # в списке процессов раннера.
          SSH="ssh -p $SERVER_SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"

          sshpass -e rsync -az --delete --stats -e "$SSH" \
            site/ "$SERVER_LOGIN@$SERVER_ADDR:$SITE_ROOT/"

          # --delete и здесь: удалённый в репозитории модуль должен исчезнуть
          # и на сервере. Каталог venv лежит рядом, в $APP_ROOT, а не внутри
          # app/, поэтому под удаление не попадает.
          sshpass -e rsync -az --delete --stats -e "$SSH" \
            --exclude='__pycache__/' --exclude='*.pyc' \
            app/ "$SERVER_LOGIN@$SERVER_ADDR:$APP_ROOT/app/"

          sshpass -e rsync -az --stats -e "$SSH" \
            requirements.txt "$SERVER_LOGIN@$SERVER_ADDR:$APP_ROOT/requirements.txt"

      - name: Configure web server and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          # Каждый секрет нужно перечислить здесь поимённо: ssh-action передаёт
          # на сервер только то, что указано в envs, остальное молча теряется.
          envs: GITHUB_SHA,SITE_ROOT,SITE_PORT,SITE_DOMAIN,APP_ROOT,APP_PORT,ADMIN_PASSWORD,ANTHROPIC_API_KEY,YANDEX_API_KEY,YANDEX_FOLDER_ID,AI_PROVIDER,AI_PHOTO,TELEGRAM_BOT_TOKEN,TELEGRAM_BOT_USERNAME,TELEGRAM_WEBHOOK_SECRET
          script: |
            set -e
            chmod -R a+rX "$SITE_ROOT"

            # Секреты приложению — через файл окружения, не через командную
            # строку: аргументы процесса видны всем в /proc, файл — только
            # владельцу. Значение никуда не печатаем, только факт наличия.
            echo "=== секреты приложения ==="
            umask 077
            : > /etc/str-1/app.env
            if [ -n "$ADMIN_PASSWORD" ]; then
              printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD" >> /etc/str-1/app.env
              echo "ADMIN_PASSWORD: задан (${#ADMIN_PASSWORD} символов)"
            else
              echo "::warning::ADMIN_PASSWORD не задан — админка будет отвечать 503"
            fi
            if [ -n "$ANTHROPIC_API_KEY" ]; then
              printf 'ANTHROPIC_API_KEY=%s\n' "$ANTHROPIC_API_KEY" >> /etc/str-1/app.env
              echo "ANTHROPIC_API_KEY: задан (${#ANTHROPIC_API_KEY} символов)"
            fi
            if [ -n "$YANDEX_API_KEY" ] && [ -n "$YANDEX_FOLDER_ID" ]; then
              printf 'YANDEX_API_KEY=%s\n'   "$YANDEX_API_KEY"   >> /etc/str-1/app.env
              printf 'YANDEX_FOLDER_ID=%s\n' "$YANDEX_FOLDER_ID" >> /etc/str-1/app.env
              echo "YANDEX_API_KEY: задан (${#YANDEX_API_KEY} символов), каталог задан"
            elif [ -n "$YANDEX_API_KEY" ] || [ -n "$YANDEX_FOLDER_ID" ]; then
              echo "::warning::у Яндекса нужны оба секрета — YANDEX_API_KEY и YANDEX_FOLDER_ID; задан только один"
            fi
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
              printf 'TELEGRAM_BOT_TOKEN=%s\n'      "$TELEGRAM_BOT_TOKEN"      >> /etc/str-1/app.env
              printf 'TELEGRAM_WEBHOOK_SECRET=%s\n' "$TELEGRAM_WEBHOOK_SECRET" >> /etc/str-1/app.env
              echo "TELEGRAM_BOT_TOKEN: задан (${#TELEGRAM_BOT_TOKEN} символов), секрет вебхука задан"

              # Имя бота приезжает с раннера: с самого сервера api.telegram.org
              # недоступен (проверено — TCP-таймаут), а приложению оно нужно,
              # чтобы собрать ссылку привязки. Ссылку открывает телефон гостя,
              # и у него с телеграмом всё в порядке.
              if [ -n "$TELEGRAM_BOT_USERNAME" ]; then
                printf 'TELEGRAM_BOT_USERNAME=%s\n' "$TELEGRAM_BOT_USERNAME" >> /etc/str-1/app.env
                echo "бот: @$TELEGRAM_BOT_USERNAME"
              fi
            elif [ -n "$TELEGRAM_BOT_TOKEN" ] || [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
              echo "::warning::для бота нужны оба секрета — TELEGRAM_BOT_TOKEN и TELEGRAM_WEBHOOK_SECRET; задан только один"
            fi
            # Публичный адрес: по нему собираются ссылки и QR-коды для гостей.
            # Без него они брались бы из адреса, по которому открыта админка,
            # а её открывают и по запасному входу на 8081.
            if [ -n "$SITE_DOMAIN" ]; then
              printf 'PUBLIC_BASE_URL=https://%s\n' "$SITE_DOMAIN" >> /etc/str-1/app.env
              echo "PUBLIC_BASE_URL: https://$SITE_DOMAIN"
            fi
            if [ -n "$AI_PROVIDER" ]; then
              printf 'AI_PROVIDER=%s\n' "$AI_PROVIDER" >> /etc/str-1/app.env
              echo "AI_PROVIDER: $AI_PROVIDER (выбор провайдера задан явно)"
            fi
            # Показывать ли загрузку фото, сайт решает сам: спрашивает у
            # Vision OCR, пускает ли тот его. Этот секрет — ручное
            # переопределение на случай, когда решение надо продавить
            # (docs/RUNBOOK.md, «Фото этикетки не распознаётся»).
            if [ -n "$AI_PHOTO" ]; then
              printf 'AI_PHOTO=%s\n' "$AI_PHOTO" >> /etc/str-1/app.env
              echo "AI_PHOTO: $AI_PHOTO (распознавание по фотографии задано явно)"
            fi
            if [ -z "$ANTHROPIC_API_KEY" ] && [ -z "$YANDEX_API_KEY" ]; then
              echo "::warning::ключей распознавания нет — поиск виски работает только по справочнику"
            fi
            umask 022
            chown root:str1 /etc/str-1/app.env
            chmod 640 /etc/str-1/app.env

            # Приложение поднимаем ДО того, как Caddy начнёт на него проксировать:
            # иначе между переключением конфига и стартом службы посетитель
            # получал бы 502.
            echo "=== зависимости приложения ==="
            [ -x "$APP_ROOT/venv/bin/python" ] || python3 -m venv "$APP_ROOT/venv"
            "$APP_ROOT/venv/bin/pip" install -q --upgrade pip
            "$APP_ROOT/venv/bin/pip" install -q -r "$APP_ROOT/requirements.txt"
            chmod -R a+rX "$APP_ROOT"

            echo "=== служба приложения ==="
            cat > /etc/systemd/system/str-1-app.service <<UNIT
            [Unit]
            Description=Str-1 whisky tasting app
            After=network.target

            [Service]
            Type=simple
            User=str1
            Group=str1
            WorkingDirectory=$APP_ROOT
            Environment=PYTHONUNBUFFERED=1
            EnvironmentFile=/etc/str-1/app.env
            # proxy-headers: приложение узнаёт настоящий адрес посетителя и
            # протокол из заголовков Caddy. Доверяем только localhost — снаружи
            # в приложение никто не ходит.
            ExecStart=$APP_ROOT/venv/bin/uvicorn app.main:app --host 127.0.0.1 --port $APP_PORT --proxy-headers --forwarded-allow-ips 127.0.0.1
            Restart=always
            RestartSec=3
            NoNewPrivileges=yes
            PrivateTmp=yes
            ProtectSystem=full
            ProtectHome=yes
            ReadWritePaths=/var/lib/str-1

            [Install]
            WantedBy=multi-user.target
            UNIT
            # Отступы нужны YAML-блоку выше, systemd их не понимает — срезаем.
            sed -i 's/^[[:space:]]*//' /etc/systemd/system/str-1-app.service

            echo "=== ежедневный бэкап базы ==="
            # VACUUM INTO снимает согласованную копию на живой базе: файл
            # app.db копировать нельзя, в режиме WAL свежие записи лежат в -wal.
            mkdir -p /var/backups/str-1
            chown str1:str1 /var/backups/str-1
            chmod 750 /var/backups/str-1

            cat > /etc/systemd/system/str-1-backup.service <<UNIT
            [Unit]
            Description=Str-1 daily SQLite backup
            After=str-1-app.service

            [Service]
            Type=oneshot
            User=str1
            Group=str1
            WorkingDirectory=$APP_ROOT
            EnvironmentFile=/etc/str-1/app.env
            ExecStart=$APP_ROOT/venv/bin/python -m app.backup
            NoNewPrivileges=yes
            PrivateTmp=yes
            ProtectSystem=full
            ProtectHome=yes
            ReadWritePaths=/var/lib/str-1 /var/backups/str-1
            UNIT

            cat > /etc/systemd/system/str-1-backup.timer <<UNIT
            [Unit]
            Description=Str-1 daily SQLite backup

            [Timer]
            OnCalendar=daily
            # Пропущенный запуск (сервер был выключен) наверстывается.
            Persistent=true
            RandomizedDelaySec=15m

            [Install]
            WantedBy=timers.target
            UNIT

            sed -i 's/^[[:space:]]*//' /etc/systemd/system/str-1-backup.service
            sed -i 's/^[[:space:]]*//' /etc/systemd/system/str-1-backup.timer

            systemctl daemon-reload
            systemctl enable str-1-app >/dev/null 2>&1 || true
            systemctl restart str-1-app
            systemctl enable --now str-1-backup.timer >/dev/null 2>&1 || true

            # Первый бэкап делаем сразу: иначе до полуночи копии не существует,
            # а проверять её работоспособность лучше сейчас, а не в аварии.
            if systemctl start str-1-backup; then
              echo "бэкапы: $(ls -1 /var/backups/str-1/app-*.db.gz 2>/dev/null | wc -l) шт."
            else
              echo "::warning::бэкап не отработал — смотри journalctl -u str-1-backup"
            fi

            echo "=== ждём приложение на 127.0.0.1:$APP_PORT ==="
            app_ok=""
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$APP_PORT/api/health"; then app_ok=1; break; fi
              sleep 2
            done
            if [ -z "$app_ok" ]; then
              echo "::error::приложение не поднялось — логи ниже"
              journalctl -u str-1-app --no-pager -n 60 || true
              exit 1
            fi
            health=$(curl -fsS "http://127.0.0.1:$APP_PORT/api/health")
            echo "app health: $health"

            # Секрет мог быть задан в репозитории, но не доехать до приложения —
            # например, если его забыли перечислить в envs у ssh-action. Раньше
            # это выключало функцию молча и деплой рапортовал об успехе.
            case "$health" in
              *'"admin":true'*) : ;;
              *) [ -z "$ADMIN_PASSWORD" ] || { echo "::error::ADMIN_PASSWORD задан в секретах, но не доехал до приложения"; exit 1; } ;;
            esac
            # Мало знать, что распознавание включено: с сервера в России
            # Anthropic не работает, поэтому при наличии ключей Яндекса
            # отвечать должен именно он.
            case "$health" in
              *'"ai_provider":"yandex"'*) : ;;
              *) if [ -n "$YANDEX_API_KEY" ] && [ -n "$YANDEX_FOLDER_ID" ] \
                    && [ "$AI_PROVIDER" != "anthropic" ] && [ "$AI_PROVIDER" != "off" ]; then
                   echo "::error::ключи Яндекса заданы, но приложение отвечает другим провайдером"; exit 1
                 fi ;;
            esac
            case "$health" in
              *'"ai":true'*) : ;;
              *) if [ -n "$ANTHROPIC_API_KEY" ] || [ -n "$YANDEX_API_KEY" ]; then
                   echo "::error::ключи распознавания заданы в секретах, но не доехали до приложения"; exit 1
                 fi ;;
            esac
            case "$health" in
              *'"ai_photo":true'*) : ;;
              *) case "$AI_PHOTO" in
                   on|1|yes|да) echo "::error::AI_PHOTO включён в секретах, но приложение фото не предлагает"; exit 1 ;;
                 esac ;;
            esac

            echo "=== конфиг отдельного экземпляра Caddy ==="
            # admin off обязателен: админский endpoint по умолчанию слушает
            # 127.0.0.1:2019, он уже занят основным Caddy, и второй процесс
            # без этой строки не стартует вовсе.
            cat > /etc/caddy/str-1.caddyfile <<CADDY
            {
            	admin off
            }

            :$SITE_PORT {
            	encode gzip
            	root * $SITE_ROOT

            	# healthz и version отдаются файлами намеренно: по ним проверяется,
            	# что доехал деплой. Если бы их отдавало приложение, его падение
            	# выглядело бы как провалившийся выкат.
            	@static path /healthz /version /robots.txt /favicon.ico /static/*
            	handle @static {
            		file_server
            	}

            	handle {
            		reverse_proxy 127.0.0.1:$APP_PORT
            	}

            	# Приложение недоступно — показываем запасную страницу из site/,
            	# а не голую ошибку Caddy.
            	handle_errors 502 503 504 {
            		rewrite * /index.html
            		file_server
            	}
            }
            CADDY
            caddy fmt --overwrite /etc/caddy/str-1.caddyfile || true
            caddy validate --config /etc/caddy/str-1.caddyfile --adapter caddyfile

            echo "=== systemd-юнит ==="
            cat > /etc/systemd/system/str-1-site.service <<UNIT
            [Unit]
            Description=Str-1 static site
            After=network.target

            [Service]
            Type=simple
            User=caddy
            Group=caddy
            ExecStart=/usr/bin/caddy run --config /etc/caddy/str-1.caddyfile --adapter caddyfile
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            UNIT
            # Отступы нужны YAML-блоку выше, systemd их не понимает — срезаем.
            sed -i 's/^[[:space:]]*//' /etc/systemd/system/str-1-site.service

            systemctl daemon-reload
            systemctl enable str-1-site >/dev/null 2>&1 || true
            systemctl restart str-1-site

            echo "=== ждём сайт на 127.0.0.1:$SITE_PORT ==="
            ok=""
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$SITE_PORT/"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::сайт не поднялся — логи ниже"
              journalctl -u str-1-site --no-pager -n 60 || true
              exit 1
            fi
            echo "index:   OK"
            echo "healthz: $(curl -fsS http://127.0.0.1:$SITE_PORT/healthz)"
            # Проверяем не только что Caddy жив, но и что проксирование настроено:
            # этот путь обслуживает уже приложение, а не файлы.
            echo "api:     $(curl -fsS http://127.0.0.1:$SITE_PORT/api/health)"
            # /api/health отвечает, даже когда шаблоны или база сломаны: он
            # ничего не рендерит. Поэтому дополнительно дёргаем живую страницу
            # со справочником — она ходит в базу и рисует шаблон.
            if curl -fsS -o /dev/null "http://127.0.0.1:$SITE_PORT/whisky"; then
              echo "страница:  OK (шаблоны и база отвечают)"
            else
              echo "::error::/whisky не отдаётся — шаблон или база сломаны"
              journalctl -u str-1-app --no-pager -n 40 || true
              exit 1
            fi

            # Домен и TLS обслуживает ОСНОВНОЙ Caddy: порты 80/443 заняты им, а
            # два процесса один порт не поделят. Сам /etc/caddy/Caddyfile мы не
            # трогаем — деплой Str пересобирает его с нуля и затёр бы правку;
            # вместо этого кладём свой блок в каталог, который тот файл
            # импортирует.
            SITES_D=/etc/caddy/sites.d
            OUR=$SITES_D/str-1.caddy
            if [ -n "$SITE_DOMAIN" ]; then
              echo "=== блок для $SITE_DOMAIN в основном Caddy ==="
              mkdir -p "$SITES_D"
              cat > "$OUR" <<CADDY
            $SITE_DOMAIN {
            	encode gzip
            	root * $SITE_ROOT

            	@static path /healthz /version /robots.txt /favicon.ico /static/*
            	handle @static {
            		file_server
            	}

            	handle {
            		reverse_proxy 127.0.0.1:$APP_PORT
            	}

            	handle_errors 502 503 504 {
            		rewrite * /index.html
            		file_server
            	}
            }

            http://$SITE_DOMAIN {
            	redir https://$SITE_DOMAIN{uri} permanent
            }
            CADDY
              sed -i 's/^[[:space:]]\{12\}//' "$OUR"

              # Без import наш файл просто лежит мёртвым грузом, и деплой
              # отрапортовал бы об успехе при неработающем HTTPS. Падаем явно:
              # сайт на порту 8081 при этом продолжает работать.
              if ! grep -q 'sites\.d' /etc/caddy/Caddyfile; then
                rm -f "$OUR"
                echo "::error::основной /etc/caddy/Caddyfile не импортирует $SITES_D — в репозитории Str нужен деплой с этой строкой, иначе HTTPS для Str-1 невозможен"
                exit 1
              fi

              # Валидируем весь основной конфиг вместе с нашим блоком. Если он
              # плох — убираем свой файл и падаем, НЕ перезагружая Caddy: чужой
              # сайт должен остаться на прежнем рабочем конфиге.
              if ! caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
                rm -f "$OUR"
                echo "::error::наш блок ломает основной конфиг Caddy — файл удалён, перезагрузка не выполнялась"
                exit 1
              fi
              systemctl reload caddy || systemctl restart caddy
              echo "основной Caddy перечитал конфиг"
            else
              # Режим без домена: за собой прибираем, иначе в чужом конфиге
              # останется блок на несуществующее имя.
              if [ -e "$OUR" ]; then
                rm -f "$OUR"
                caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile && \
                  { systemctl reload caddy || systemctl restart caddy; }
                echo "убрали свой блок из основного Caddy"
              fi
            fi

            if [ -n "$SITE_DOMAIN" ]; then
              echo "=== ждём сертификат для $SITE_DOMAIN ==="
              # Первый выпуск Let's Encrypt занимает секунды, но при занятом
              # DNS-кэше или лимите может тянуться; пять минут — предел.
              cert_ok=""
              for i in $(seq 1 20); do
                if curl -fsS -o /dev/null --max-time 10 "https://$SITE_DOMAIN/healthz"; then
                  cert_ok=1; echo "TLS: сертификат выпущен, HTTPS отвечает"; break
                fi
                sleep 15
              done
              if [ -z "$cert_ok" ]; then
                echo "::error::HTTPS не поднялся за 5 минут — логи ниже"
                journalctl -u caddy --no-pager -n 60 || true
                exit 1
              fi
              echo "--- сертификат ---"
              echo | openssl s_client -connect "$SITE_DOMAIN:443" -servername "$SITE_DOMAIN" 2>/dev/null \
                | openssl x509 -noout -issuer -dates || true
            fi

            echo "=== чужое хозяйство не задето ==="
            # Явная проверка, что деплой Str-1 не уронил основной сайт.
            systemctl is-active caddy || echo "::warning::основной caddy не активен"

            # Метку версии пишем последней: свежий SHA на /version означает,
            # что прогон дошёл до конца, а не только выложил файлы.
            printf '%s\n' "$GITHUB_SHA" > "$SITE_ROOT/version"
            chmod a+r "$SITE_ROOT/version"
            echo "version: $GITHUB_SHA"

      # Проверка с раннера, а не с сервера: на самом сервере сайт отвечал бы и
      # при закрытом порте. Здесь же видно то, что увидит посетитель, — открыт
      # ли 8081 наружу (ufw, файрвол хостинга) и доехал ли именно этот коммит.
      - name: Verify from outside
        run: |
          set -e
          base="http://$SERVER_ADDR:$SITE_PORT"
          got=$(curl -fsS --max-time 20 "$base/version") || {
            echo "::error::$base/version недоступен снаружи — проверьте, открыт ли порт $SITE_PORT"
            exit 1
          }
          echo "version снаружи: $got"
          [ "$got" = "$GITHUB_SHA" ] || {
            echo "::error::на сервере лежит другой коммит: $got вместо $GITHUB_SHA"
            exit 1
          }
          echo "healthz снаружи: $(curl -fsS --max-time 20 "$base/healthz")"
          echo "api снаружи:     $(curl -fsS --max-time 20 "$base/api/health")"
          echo "сайт доступен: $base/"

          # Тот же контроль для домена: HTTPS отдаёт основной Caddy, а не наш
          # экземпляр на 8081, поэтому совпадение SHA здесь проверяет ещё и то,
          # что оба смотрят в один каталог.
          if [ -n "$SITE_DOMAIN" ]; then
            https_sha=$(curl -fsS --max-time 20 "https://$SITE_DOMAIN/version") || {
              echo "::error::https://$SITE_DOMAIN/version недоступен снаружи"
              exit 1
            }
            [ "$https_sha" = "$GITHUB_SHA" ] || {
              echo "::error::по HTTPS отдаётся другой коммит: $https_sha вместо $GITHUB_SHA"
              exit 1
            }
            echo "HTTPS version:  $https_sha"
            echo "HTTPS healthz:  $(curl -fsS --max-time 20 "https://$SITE_DOMAIN/healthz")"
            echo "HTTPS api:      $(curl -fsS --max-time 20 "https://$SITE_DOMAIN/api/health")"
            # 200 — пароль админки доехал до приложения, 503 — секрет не задан.
            # Сам пароль при этом нигде не печатается.
            admin_code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$SITE_DOMAIN/admin/login")
            echo "админка:        $admin_code $( [ "$admin_code" = "503" ] && echo '(ADMIN_PASSWORD не задан)' )"
            # Редирект с HTTP на HTTPS прописан явно — проверяем, что он живой.
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "http://$SITE_DOMAIN/")
            echo "http://$SITE_DOMAIN/ -> $code (ожидается 301)"
            echo "сайт доступен: https://$SITE_DOMAIN/"

            # Вебхук прописываем отсюда, а не из приложения: адрес знает только
            # деплой, и переустанавливать его на каждом старте службы незачем.
            if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_WEBHOOK_SECRET" ]; then
              # Телеграм принимает в секрете только эти символы; кириллица
              # в HTTP-заголовок не поместится, и вебхук молча не заработает.
              case "$TELEGRAM_WEBHOOK_SECRET" in
                *[!A-Za-z0-9_-]*)
                  echo "::error::TELEGRAM_WEBHOOK_SECRET содержит недопустимые символы — телеграм принимает только латиницу, цифры, _ и -"
                  exit 1 ;;
              esac
              hook="https://$SITE_DOMAIN/tg/$TELEGRAM_WEBHOOK_SECRET"
              resp=$(curl -sS -X POST "https://api.telegram.org/bot$TELEGRAM_BOT_TOKEN/setWebhook" \
                       -H 'Content-Type: application/json' \
                       -d "{\"url\": \"$hook\", \"secret_token\": \"$TELEGRAM_WEBHOOK_SECRET\", \"allowed_updates\": [\"message\"], \"drop_pending_updates\": true}")
              # В ответе может быть сам адрес с секретом — печатаем только вердикт.
              case "$resp" in
                *'"ok":true'*) echo "вебхук бота прописан" ;;
                *) echo "::error::телеграм не принял вебхук"; exit 1 ;;
              esac
            fi
          fi

  # ── BROADCAST: развезти итоги в телеграм ───────────────────────────────────
  # Существует потому, что с сервера исходящие к api.telegram.org не проходят
  # (TCP-таймаут, проверено на выкате). Отсюда — проходят. Приложение готовит
  # сообщения, раннер отправляет и докладывает, что дошло; отметка о доставке
  # ставится только по докладу, поэтому повтор безопасен.
  broadcast:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'broadcast' }}
    runs-on: ubuntu-latest
    steps:
      - name: Send results
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          SUBDOMAIN: ${{ secrets.DUCKDNS_SUBDOMAIN }}
        run: |
          set -e
          if [ -z "$TOKEN" ] || [ -z "$SECRET" ] || [ -z "$SUBDOMAIN" ]; then
            echo "::error::нужны TELEGRAM_BOT_TOKEN, TELEGRAM_WEBHOOK_SECRET и DUCKDNS_SUBDOMAIN"
            exit 1
          fi
          site="https://$SUBDOMAIN.duckdns.org"

          # Адрес с секретом в лог не печатаем — он и есть ключ к списку.
          curl -fsS --max-time 30 "$site/internal/outbox/$SECRET" > outbox.json || {
            echo "::error::сайт не отдал список рассылки"; exit 1;
          }
          python3 - <<'PY' > report.json
          import json, os, sys, urllib.request

          box = json.load(open("outbox.json"))
          print(f"дегустация: {box.get('tasting')}, к отправке: {box.get('count', 0)}", file=sys.stderr)

          token = os.environ["TOKEN"]
          delivered, failed = [], []
          for message in box.get("messages", []):
              payload = json.dumps({
                  "chat_id": message["chat_id"],
                  "text": message["text"],
                  "parse_mode": "HTML",
              }).encode()
              request = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=payload,
                  headers={"Content-Type": "application/json"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      ok = bool(json.load(response).get("ok"))
              except Exception as err:
                  # Сбой у одного не должен ронять рассылку остальным: этот
                  # участник просто не попадёт в отметку и догонится повтором.
                  print(f"не дошло {message['participant_id']}: {type(err).__name__}", file=sys.stderr)
                  ok = False
              (delivered if ok else failed).append(message["participant_id"])
          print(json.dumps({"ids": delivered, "failed": failed}))
          PY

          delivered=$(python3 -c "import json;print(len(json.load(open('report.json'))['ids']))")
          failed=$(python3 -c "import json;print(len(json.load(open('report.json'))['failed']))")
          echo "отправлено: $delivered, не дошло: $failed"

          if [ "$delivered" != "0" ]; then
            curl -fsS --max-time 30 -X POST "$site/internal/outbox/$SECRET/delivered" \
              -H 'Content-Type: application/json' --data @report.json > /dev/null
            echo "отметки о доставке записаны"
          fi
          [ "$failed" = "0" ] || echo "::warning::часть сообщений не дошла — повторный запуск догонит"

  # ── TELEGRAM: спросить у самого телеграма, что с вебхуком ──────────────────
  # Нужно ровно для одного вопроса: «нажал Старт, а привязки нет — почему?».
  # Ответ либо здесь (телеграм не может до нас достучаться), либо в админке,
  # на странице «Телеграм» (дошло, но без кода привязки).
  telegram:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'telegram' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ask Telegram about the webhook
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN не задан"
            exit 1
          fi
          curl -sS --max-time 20 "https://api.telegram.org/bot$TOKEN/getWebhookInfo" > hook.json
          python3 - <<'PY'
          import json
          info = json.load(open("hook.json")).get("result", {})
          # Сам адрес не печатаем: в нём секрет вебхука.
          print("вебхук задан:      ", "да" if info.get("url") else "НЕТ")
          print("ждут доставки:     ", info.get("pending_update_count", 0))
          print("последняя ошибка:  ", info.get("last_error_message") or "нет")
          if info.get("last_error_date"):
              import datetime
              print("когда была ошибка: ",
                    datetime.datetime.fromtimestamp(info["last_error_date"], datetime.UTC))
          print("типы обновлений:   ", info.get("allowed_updates") or "все")
          if not info.get("url"):
              print("::warning::вебхук не зарегистрирован — запустите обычный деплой, он его ставит")
          if info.get("last_error_message"):
              print("::warning::телеграм не смог доставить обновление — текст ошибки выше")
          PY

  # ── INSPECT: только осмотреть сервер, ничего не менять ──────────────────────
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'inspect' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          envs: SITE_ROOT,SITE_PORT,APP_ROOT,APP_PORT
          script: |
            echo "=== OS ==="; head -2 /etc/os-release 2>&1 || true
            echo "=== whoami ==="; whoami
            echo "=== слушают порты ==="; (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ":80 |:443 |:$SITE_PORT |:$APP_PORT " || echo "ничего не слушает"
            echo "=== службы ==="
            echo "caddy (Str):      $(systemctl is-active caddy 2>/dev/null || echo нет)"
            echo "str-api (Str):    $(systemctl is-active str-api 2>/dev/null || echo нет)"
            echo "str-1-site:       $(systemctl is-active str-1-site 2>/dev/null || echo нет)"
            echo "str-1-app:        $(systemctl is-active str-1-app 2>/dev/null || echo нет)"
            echo "=== приложение ==="
            curl -fsS --max-time 5 "http://127.0.0.1:$APP_PORT/api/health" || echo "не отвечает"
            echo
            journalctl -u str-1-app --no-pager -n 15 2>/dev/null || true
            echo "=== база ==="; ls -la /var/lib/str-1 2>/dev/null || echo "каталога нет"
            # Только права и размер: содержимое файла с секретами не печатаем.
            echo "=== файл секретов ==="; ls -l /etc/str-1/app.env 2>/dev/null || echo "файла нет"
            echo "=== каталог Str-1 ==="; ls -la "$SITE_ROOT" 2>/dev/null || echo "каталога нет"
            echo "=== version ==="; cat "$SITE_ROOT/version" 2>/dev/null || echo "нет файла version"
            # Договорённость с репозиторием Str: без этой строки наш блок лежит
            # мёртвым грузом и HTTPS не работает, поэтому смотрим на неё прямо.
            echo "=== import в основном Caddyfile ==="
            grep -n 'sites\.d' /etc/caddy/Caddyfile 2>/dev/null || echo "НЕТ — HTTPS для Str-1 работать не будет"
            echo "=== наш блок ==="; cat /etc/caddy/sites.d/str-1.caddy 2>/dev/null || echo "файла нет"
            echo "=== сертификаты Caddy ==="
            find /var/lib/caddy -name '*.crt' 2>/dev/null | head || echo "нет сертификатов"
            echo "=== disk ==="; df -h / | tail -1
