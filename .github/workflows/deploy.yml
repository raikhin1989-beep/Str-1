name: Deploy to server

# Деплой статического сайта из каталога site/ на тот же сервер, где уже живёт
# проект Str (https://raikhin.duckdns.org/).
#
# ВАЖНО, ПОЧЕМУ ЗДЕСЬ ОТДЕЛЬНЫЙ CADDY НА ПОРТУ 8081, А НЕ ОСНОВНОЙ НА 80/443:
# деплой репозитория Str перезаписывает /etc/caddy/Caddyfile целиком и
# синхронизирует /var/www/html с --delete. Если бы этот workflow писал в те же
# места, два проекта затирали бы друг друга — Str-1 пропадал бы при каждом
# деплое Str. Поэтому здесь всё своё и ничего общего:
#   каталог сайта      /var/www/str-1        (Str пользуется /var/www/html)
#   конфиг веб-сервера /etc/caddy/str-1.caddyfile  (Str — /etc/caddy/Caddyfile)
#   служба             str-1-site.service    (Str — caddy.service)
#   порт               8081                  (Str — 80 и 443)
# Основной Caddy, сайт Str и его бэкенд этим workflow не затрагиваются.
#
# Это временная схема для проверки доступа. Чтобы отдавать Str-1 по нормальному
# имени и HTTPS, нужен второй домен и общий Caddyfile — это правка сразу двух
# репозиториев, она делается отдельным шагом.
#
# Секреты репозитория (Settings → Secrets and variables → Actions):
#   SERVER_HOST     — IP/домен сервера       [обязательно]
#   SERVER_PASSWORD — пароль SSH             [обязательно]
#   SERVER_USER     — пользователь SSH       [опционально, по умолчанию root]
#   SERVER_PORT     — порт SSH               [опционально, по умолчанию 22]

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      action:
        description: "Что сделать на сервере"
        type: choice
        options: [deploy, inspect]
        default: deploy

concurrency:
  group: deploy-server-str-1
  cancel-in-progress: false

env:
  SITE_ROOT: /var/www/str-1
  SITE_PORT: "8081"

jobs:
  # ── DEPLOY: выложить содержимое site/ на сервер ─────────────────────────────
  deploy:
    if: ${{ github.event_name == 'push' || inputs.action == 'deploy' }}
    runs-on: ubuntu-latest
    env:
      SERVER_ADDR: ${{ secrets.SERVER_HOST }}
      SERVER_LOGIN: ${{ secrets.SERVER_USER || 'root' }}
      SERVER_SSH_PORT: ${{ secrets.SERVER_PORT || 22 }}
    steps:
      # Проверка до первого подключения: иначе про незаданный секрет узнаёшь из
      # невнятной ошибки ssh-action, а не из явного сообщения.
      - name: Check secrets
        env:
          PASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          missing=""
          [ -n "$SERVER_ADDR" ] || missing="$missing SERVER_HOST"
          [ -n "$PASS" ]        || missing="$missing SERVER_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::не заданы секреты репозитория:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "секреты на месте; вход: $SERVER_LOGIN@***:$SERVER_SSH_PORT"

      - uses: actions/checkout@v4

      # Caddy на сервере уже стоит из-под проекта Str, но полагаться на это
      # нельзя: сервер могут пересоздать. Шаг идемпотентный.
      - name: Prepare server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          envs: SITE_ROOT,SITE_PORT
          script: |
            set -e
            export DEBIAN_FRONTEND=noninteractive

            echo "=== caddy и rsync ==="
            if ! command -v caddy >/dev/null 2>&1; then
              apt-get update -qq
              apt-get install -y -qq debian-keyring debian-archive-keyring apt-transport-https curl gnupg rsync
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/gpg.key' \
                | gpg --dearmor -o /usr/share/keyrings/caddy-stable-archive-keyring.gpg
              curl -1sLf 'https://dl.cloudsmith.io/public/caddy/stable/debian.deb.txt' \
                > /etc/apt/sources.list.d/caddy-stable.list
              apt-get update -qq
              apt-get install -y -qq caddy
            else
              command -v rsync >/dev/null 2>&1 || apt-get install -y -qq rsync
            fi
            caddy version

            echo "=== каталог сайта ==="
            mkdir -p "$SITE_ROOT"

            echo "=== порт $SITE_PORT в ufw, если он включён ==="
            if command -v ufw >/dev/null 2>&1 && ufw status | grep -q '^Status: active'; then
              ufw allow "${SITE_PORT}/tcp" >/dev/null 2>&1 || true
            fi

      # rsync, а не envs ssh-action: через окружение проходят только маленькие
      # текстовые полезные нагрузки, на бинарных ассетах это молча ломается.
      - name: Upload site
        env:
          SSHPASS: ${{ secrets.SERVER_PASSWORD }}
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          # sshpass -e читает пароль из окружения, чтобы он не был виден
          # в списке процессов раннера.
          sshpass -e rsync -az --delete --stats \
            -e "ssh -p $SERVER_SSH_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            site/ "$SERVER_LOGIN@$SERVER_ADDR:$SITE_ROOT/"

      - name: Configure web server and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 10m
          envs: GITHUB_SHA,SITE_ROOT,SITE_PORT
          script: |
            set -e
            chmod -R a+rX "$SITE_ROOT"

            echo "=== конфиг отдельного экземпляра Caddy ==="
            # admin off обязателен: админский endpoint по умолчанию слушает
            # 127.0.0.1:2019, он уже занят основным Caddy, и второй процесс
            # без этой строки не стартует вовсе.
            cat > /etc/caddy/str-1.caddyfile <<CADDY
            {
            	admin off
            }

            :$SITE_PORT {
            	encode gzip
            	root * $SITE_ROOT
            	file_server
            }
            CADDY
            caddy fmt --overwrite /etc/caddy/str-1.caddyfile || true
            caddy validate --config /etc/caddy/str-1.caddyfile --adapter caddyfile

            echo "=== systemd-юнит ==="
            cat > /etc/systemd/system/str-1-site.service <<UNIT
            [Unit]
            Description=Str-1 static site
            After=network.target

            [Service]
            Type=simple
            User=caddy
            Group=caddy
            ExecStart=/usr/bin/caddy run --config /etc/caddy/str-1.caddyfile --adapter caddyfile
            Restart=always
            RestartSec=3

            [Install]
            WantedBy=multi-user.target
            UNIT
            # Отступы нужны YAML-блоку выше, systemd их не понимает — срезаем.
            sed -i 's/^[[:space:]]*//' /etc/systemd/system/str-1-site.service

            systemctl daemon-reload
            systemctl enable str-1-site >/dev/null 2>&1 || true
            systemctl restart str-1-site

            echo "=== ждём сайт на 127.0.0.1:$SITE_PORT ==="
            ok=""
            for i in $(seq 1 15); do
              if curl -fsS -o /dev/null "http://127.0.0.1:$SITE_PORT/"; then ok=1; break; fi
              sleep 2
            done
            if [ -z "$ok" ]; then
              echo "::error::сайт не поднялся — логи ниже"
              journalctl -u str-1-site --no-pager -n 60 || true
              exit 1
            fi
            echo "index:   OK"
            echo "healthz: $(curl -fsS http://127.0.0.1:$SITE_PORT/healthz)"

            echo "=== чужое хозяйство не задето ==="
            # Явная проверка, что деплой Str-1 не уронил основной сайт.
            systemctl is-active caddy || echo "::warning::основной caddy не активен"

            # Метку версии пишем последней: свежий SHA на /version означает,
            # что прогон дошёл до конца, а не только выложил файлы.
            printf '%s\n' "$GITHUB_SHA" > "$SITE_ROOT/version"
            chmod a+r "$SITE_ROOT/version"
            echo "version: $GITHUB_SHA"

      # Проверка с раннера, а не с сервера: на самом сервере сайт отвечал бы и
      # при закрытом порте. Здесь же видно то, что увидит посетитель, — открыт
      # ли 8081 наружу (ufw, файрвол хостинга) и доехал ли именно этот коммит.
      - name: Verify from outside
        run: |
          set -e
          base="http://$SERVER_ADDR:$SITE_PORT"
          got=$(curl -fsS --max-time 20 "$base/version") || {
            echo "::error::$base/version недоступен снаружи — проверьте, открыт ли порт $SITE_PORT"
            exit 1
          }
          echo "version снаружи: $got"
          [ "$got" = "$GITHUB_SHA" ] || {
            echo "::error::на сервере лежит другой коммит: $got вместо $GITHUB_SHA"
            exit 1
          }
          echo "healthz снаружи: $(curl -fsS --max-time 20 "$base/healthz")"
          echo "сайт доступен: $base/"

  # ── INSPECT: только осмотреть сервер, ничего не менять ──────────────────────
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'inspect' }}
    runs-on: ubuntu-latest
    steps:
      - name: Inspect server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER || 'root' }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          command_timeout: 5m
          envs: SITE_ROOT,SITE_PORT
          script: |
            echo "=== OS ==="; head -2 /etc/os-release 2>&1 || true
            echo "=== whoami ==="; whoami
            echo "=== слушают порты ==="; (ss -tlnp 2>/dev/null || netstat -tlnp 2>/dev/null) | grep -E ":80 |:443 |:$SITE_PORT " || echo "ничего не слушает"
            echo "=== службы ==="
            echo "caddy (Str):      $(systemctl is-active caddy 2>/dev/null || echo нет)"
            echo "str-api (Str):    $(systemctl is-active str-api 2>/dev/null || echo нет)"
            echo "str-1-site:       $(systemctl is-active str-1-site 2>/dev/null || echo нет)"
            echo "=== каталог Str-1 ==="; ls -la "$SITE_ROOT" 2>/dev/null || echo "каталога нет"
            echo "=== version ==="; cat "$SITE_ROOT/version" 2>/dev/null || echo "нет файла version"
            echo "=== disk ==="; df -h / | tail -1
