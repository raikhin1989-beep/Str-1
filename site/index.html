<!doctype html>
<html lang="ru">
<!--
  Запасная страница. Обычно / отдаёт приложение через reverse_proxy; этот файл
  Caddy показывает, когда приложение не отвечает (handle_errors), и он же
  остаётся на / , если проксирование убрать — это описанный в плане откат.
-->
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дегустация виски — сайт недоступен</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <main class="page">
    <h1 class="title">Секунду</h1>
    <p class="lead">Сайт дегустации сейчас недоступен — скорее всего, идёт обновление.</p>
    <section class="card">
      <p>Обновите страницу через минуту. Если не помогло, напишите организатору.</p>
    </section>
  </main>
</body>
</html>
